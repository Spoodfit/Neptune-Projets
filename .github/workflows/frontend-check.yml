name: Frontend integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check server.mjs
          for file in app/*.js; do node --check "$file"; done
      - name: Check spatial product contract
        run: |
          test -f styles/spatial.css
          test -f styles/spatial-refine.css
          grep -q 'id="project-focus"' index.html
          grep -q 'id="project-path"' index.html
          grep -q 'id="role-orbit"' index.html
          grep -q 'id="role-ask-ai"' index.html
          grep -q 'data-resolve-blocker' app/project.js
          grep -q "type: 'resolution'" app/ai-parse.js
      - name: Reject prototype copy in product UI
        run: |
          ! grep -E -n 'prêt à être branché|Connexion production|Le backend pourra|fourni par l.API' index.html app/*.js

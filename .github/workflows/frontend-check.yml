name: Frontend integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check server.mjs
          for file in app/*.js; do node --check "$file"; done
      - name: Check direct manipulation product contract
        run: |
          test -f styles/canva-light.css
          grep -q 'id="add-project-trigger"' index.html
          grep -q 'id="project-focus"' index.html
          grep -q 'id="project-name-input"' index.html
          grep -q 'id="project-status-select"' index.html
          grep -q 'id="role-orbit"' index.html
          grep -q 'id="task-list"' index.html
          grep -q 'data-resize-project' app/timeline.js
          grep -q 'beginProjectCreation' app/timeline.js
          grep -q 'renderRoleTasks' app/project.js
          grep -q 'project-progress-flow' app/timeline.js
      - name: Check light visual contract
        run: |
          grep -q 'color-scheme" content="light"' index.html
          grep -q 'background_color.*#ffffff' manifest.webmanifest
          grep -q 'canva-light.css' styles.css
      - name: Reject obsolete product layers
        run: |
          ! grep -q 'spatial-actions.js' app.js
          ! grep -q 'styles/spatial.css' styles.css
          ! grep -E -n 'prêt à être branché|Connexion production|Le backend pourra|fourni par l.API' index.html app/*.js
